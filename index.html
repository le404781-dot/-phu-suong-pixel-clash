<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#060914"><title>AURA FIGHT — Phú × Sương V4</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:fixed;inset:0;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}.hud{position:absolute;top:12px;width:40%;z-index:5}.left{left:3%}.right{right:3%;text-align:right}.name{font-size:clamp(14px,2.5vw,24px);font-weight:1000;text-shadow:0 2px 4px #000}.bar{height:18px;background:#15192a;border:2px solid #d9e0ff;border-radius:10px;overflow:hidden}.fill{height:100%;transition:width .1s}.pbar{background:linear-gradient(90deg,#45d6ff,#b9f6ff)}.sbar{background:linear-gradient(90deg,#ff72c8,#ffd1ef)}.energy{margin-top:4px;height:7px;background:#101528;border-radius:5px;overflow:hidden}.energy i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5d6dff,#c9ffff);box-shadow:0 0 10px #71eaff}.timer{position:absolute;z-index:6;top:10px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:1000;text-shadow:0 2px 5px #000}.center{position:absolute;z-index:8;left:50%;top:15%;transform:translateX(-50%);font-size:clamp(18px,5vw,48px);font-weight:1000;text-align:center;text-shadow:0 3px 10px #000;pointer-events:none}.controls{position:absolute;z-index:10;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 3%;pointer-events:none}.pad{display:flex;gap:6px;pointer-events:auto}.btn{width:50px;height:50px;border-radius:50%;border:1px solid #8992b4;background:#10182ddd;color:#fff;font-weight:1000;backdrop-filter:blur(5px)}.ult{border-color:#d77cff;box-shadow:0 0 12px #a53dff66}.danger{border-color:#ffdd63}.menu{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#18234ddd,#03050bea)}.panel{width:min(620px,92vw);padding:25px;border:1px solid #69749b;border-radius:22px;background:#0b1020ee;text-align:center;box-shadow:0 25px 90px #000}.panel h1{font-size:clamp(36px,10vw,70px);margin:0;text-shadow:0 0 30px #67e8ff}.panel p{color:#b9c4e6}.panel button{padding:12px 18px;border:1px solid #7581a8;border-radius:12px;background:#e9edff;color:#0a0d17;font-weight:1000;margin:4px}.hidden{display:none!important}
</style></head><body><div id="game"><canvas id="c"></canvas><div class="hud left"><div class="name">PHÚ</div><div class="bar"><div id="hp0" class="fill pbar"></div></div><div class="energy"><i id="en0"></i></div></div><div class="hud right"><div class="name">SƯƠNG</div><div class="bar"><div id="hp1" class="fill sbar"></div></div><div class="energy"><i id="en1"></i></div></div><div id="timer" class="timer">99</div><div id="msg" class="center"></div><div id="menu" class="menu"><div class="panel"><h1>AURA FIGHT</h1><p>V4 • Phú × Sương • Pixel Arena</p><p>Né • Lướt • Phản đòn • Không chiến • Charge Aura • Ultimate II • KO</p><button id="start">BẮT ĐẦU</button></div></div><div class="controls"><div class="pad"><button class="btn" data-k="a">◀</button><button class="btn" data-k="d">▶</button><button class="btn" data-k="w">▲</button><button class="btn" data-k="j">⚔</button><button class="btn danger" data-k="i">◎</button><button class="btn ult" data-k="k">✦</button><button class="btn ult" data-k="u">✦²</button><button class="btn" data-k="l">🛡</button></div><div class="pad"><button class="btn" data-k="ArrowLeft">◀</button><button class="btn" data-k="ArrowRight">▶</button><button class="btn" data-k="ArrowUp">▲</button><button class="btn" data-k="Numpad1">⚔</button><button class="btn danger" data-k="Numpad0">◎</button><button class="btn ult" data-k="Numpad2">✦</button><button class="btn ult" data-k="Numpad5">✦²</button><button class="btn" data-k="Numpad3">🛡</button></div></div></div>
<script src="motion-models.js"></script><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),keys={},press={};let W,H,dpr,run=false,last=0,t=99,shake=0,particles=[],texts=[],bgStars=[];
const C=[{id:'phu',name:'Phú',hp:1250,atk:125,def:125,speed:4.8,crit:.08,skill:340,skill2:560},{id:'suong',name:'Sương',hp:950,atk:145,def:90,speed:6.2,crit:.18,skill:420,skill2:690}];
const P=[{c:C[0],x:W*.3,y:0,vx:0,vy:0,hp:1250,en:0,state:'idle',cd:0,skillCd:0,combo:0,comboT:0,inv:0,block:false,charge:false,ko:0},{c:C[1],x:W*.7,y:0,vx:0,vy:0,hp:950,en:0,state:'idle',cd:0,skillCd:0,combo:0,comboT:0,inv:0,block:false,charge:false,ko:0}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);for(const p of P)if(!p.y)p.y=H*.72;bgStars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H*.6,r:Math.random()*1.8,a:.2+Math.random()*.7}))}addEventListener('resize',resize);resize();
const ground=()=>H*.75;
function reset(){t=99;shake=0;particles=[];texts=[];P[0]={...P[0],x:W*.3,y:ground(),vy:0,vx:0,hp:C[0].hp,en:0,state:'idle',cd:0,skillCd:0,combo:0,comboT:0,inv:0,block:false,charge:false,ko:0};P[1]={...P[1],x:W*.7,y:ground(),vy:0,vx:0,hp:C[1].hp,en:0,state:'idle',cd:0,skillCd:0,combo:0,comboT:0,inv:0,block:false,charge:false,ko:0};document.getElementById('menu').classList.add('hidden');document.getElementById('msg').textContent='';run=true;last=performance.now();requestAnimationFrame(loop)}
function fx(x,y,n=12,col='#fff',power=180){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=Math.random()*power+40;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.45+Math.random()*.4,col})}}function floatText(x,y,s){texts.push({x,y,s,l:.8})}
function facing(i){return P[1-i].x>P[i].x?1:-1}function dist(i){return Math.abs(P[i].x-P[1-i].x)}function gain(i,n){P[i].en=Math.min(100,P[i].en+n)}
function damage(att,base,type='hit'){const a=P[att],d=P[1-att];if(d.inv>0||d.ko>0)return;let amount=base;if(d.block)amount=Math.max(2,base*.2);else if(Math.random()<a.c.crit)amount*=1.5;amount*=100/(100+d.c.def*.35);d.hp=Math.max(0,Math.round(d.hp-amount));gain(att,type.startsWith('ult')?12:8);gain(1-att,12);d.inv=.10;d.state='hit';fx(d.x,d.y-80,type==='ult2'?'#eab7ff':type==='ult'?'#8fffff':'#fff',type==='ult2'?34:18);floatText(d.x,d.y-110,'-'+Math.round(amount));shake=Math.max(shake,type==='ult2'?14:type==='ult'?9:4);if(d.hp<=0)ko(att)}
function attack(i){let a=P[i],d=P[1-i];if(a.cd>0||a.skillCd>0||a.ko>0)return;if(!a.onGround){airAttack(i);return}a.combo=a.comboT>0?Math.min(3,a.combo+1):1;a.comboT=.85;a.cd=.22;a.state='attack'+a.combo;let reach=[70,82,98][a.combo-1];fx(a.x+facing(i)*45,a.y-70,6,'#dff');if(dist(i)<reach)damage(i,a.c.atk*([1,1.2,1.55][a.combo-1]),'hit')}
function airAttack(i){let a=P[i];if(a.cd>0||a.ko>0)return;a.cd=.32;a.state='airAttack';fx(a.x,a.y-75,8,i?'#ff91d9':'#8feaff');if(dist(i)<105)damage(i,a.c.atk*1.45,'hit')}
function dash(i){let a=P[i];if(a.cd>0||a.ko>0||a.en<25)return;a.en-=25;a.inv=.24;a.cd=.45;a.state='dodge';a.x+=facing(i)*105;fx(a.x,a.y-60,14,i?'#f58bd1':'#72eaff',110)}
function parry(i){let a=P[i];if(a.cd>0||a.ko>0)return;a.cd=.55;a.inv=.30;a.state='parry';if(dist(i)<90){P[1-i].inv=.2;P[1-i].state='hit';damage(i,a.c.atk*1.9,'parry');floatText(a.x,a.y-120,'PARRY!')}}
function ultimate(i,tier){let a=P[i];if(a.ko>0||a.skillCd>0)return;let cost=tier===2?100:75;if(a.en<cost)return;a.en-=cost;a.skillCd=tier===2?5:3;a.inv=.65;a.state=tier===2?'ult2':'ult';let f=facing(i);a.x+=f*(tier===2?150:105);fx(a.x,a.y-70,tier===2?55:35,tier===2?(i?'#ff52c9':'#62eaff'):'#fff',tier===2?300:220);shake=tier===2?18:10;floatText(a.x,a.y-150,tier===2?'ULTIMATE II!':a.c.skill===420?'BÁ KHÍ!':'THIẾT QUYỀN!');setTimeout(()=>{if(!run||a.ko>0)return;if(dist(i)<(tier===2?190:150))damage(i,tier===2?a.c.skill2:a.c.skill,tier===2?'ult2':'ult')},220)}
function updateInput(i){let a=P[i],left=i?keys.ArrowLeft:keys.a,right=i?keys.ArrowRight:keys.d,jump=i?press.ArrowUp:press.w; a.block=!!(i?keys.Numpad3:keys.l);if(a.block){a.state='block';return}if(a.ko>0)return;if(left)a.vx=-a.c.speed;if(right)a.vx=a.c.speed;if(!left&&!right)a.vx*=.82;if(jump&&a.y>=ground()-2){a.vy=-18;a.state='jump';}if(i?press.Numpad1:press.j)attack(i);if(i?press.Numpad0:press.i)dash(i);if(i?press.Numpad2:press.k)ultimate(i,1);if(i?press.Numpad5:press.u)ultimate(i,2);if(i?press.Numpad4:press.o)parry(i)}
function ai(){let a=P[1],d=P[0];if(a.ko)return;let dx=d.x-a.x;if(Math.abs(dx)>130)a.vx=Math.sign(dx)*a.c.speed*.62;else a.vx*=.7;if(d.state.startsWith('attack')&&Math.random()<.06)a.inv=.2;if(Math.abs(dx)<100&&Math.random()<.08)attack(1);if(Math.abs(dx)<160&&a.en>=75&&Math.random()<.02)ultimate(1,1);if(a.en>=100&&Math.abs(dx)<220&&Math.random()<.015)ultimate(1,2);if(Math.random()<.008)dash(1)}
function physics(a,dt){if(a.ko>0){a.ko-=dt;a.vx*=.96;return}a.vy+=45*dt;a.y+=a.vy*dt;if(a.y>=ground()){a.y=ground();a.vy=0}a.x+=a.vx*dt;a.x=Math.max(45,Math.min(W-45,a.x));a.cd=Math.max(0,a.cd-dt);a.skillCd=Math.max(0,a.skillCd-dt);a.comboT=Math.max(0,a.comboT-dt);a.inv=Math.max(0,a.inv-dt);if(a.comboT<=0)a.combo=0;if(a.state==='hit'&&a.inv<=0)a.state='idle';if(a.state==='attack1'||a.state==='attack2'||a.state==='attack3'||a.state==='airAttack'||a.state==='ult'||a.state==='ult2'){}else if(a.y<ground()-2)a.state='jump';else if(Math.abs(a.vx)>1)a.state=Math.abs(a.vx)>a.c.speed*.8?'run':'walk';else a.state='idle'}
function ko(w){let d=P[1-w];if(d.ko>0)return;d.ko=999;d.state='ko';d.hp=0;fx(d.x,d.y-70,70,w?'#ff4fae':'#59eaff',350);floatText(W/2,H*.3,w===0?'PHÚ KO!':'SƯƠNG KO!');setTimeout(()=>{run=false;document.getElementById('msg').textContent=w===0?'PHÚ THẮNG!':'SƯƠNG THẮNG!';document.getElementById('menu').classList.remove('hidden')},1000)}
function drawF(a,i){ctx.save();ctx.translate(a.x,a.y);ctx.scale(i?-1:1,1);let col=i?'#ff75c8':'#62ddff';let aura=a.en>55||a.state==='ult'||a.state==='ult2';if(aura){let g=ctx.createRadialGradient(0,-65,10,0,-65,110);g.addColorStop(0,col+'aa');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-65,110,0,7);ctx.fill()}let bob=(a.state==='walk'||a.state==='run')?Math.sin(performance.now()/90)*4:0;ctx.translate(0,bob);ctx.fillStyle='#11182a';ctx.beginPath();ctx.arc(0,-112,30,0,7);ctx.fill();ctx.fillStyle=i?'#ffd4e9':'#d9f7ff';ctx.beginPath();ctx.arc(0,-105,25,0,7);ctx.fill();ctx.fillStyle=col;ctx.fillRect(-25,-78,50,60);ctx.fillStyle='#e7b996';ctx.fillRect(-18,-18,12,34);ctx.fillRect(7,-18,12,34);ctx.fillStyle='#fff';ctx.fillRect(8,-110,6,5);ctx.fillRect(-14,-110,6,5);ctx.strokeStyle=col;ctx.lineWidth=8;if(a.state.startsWith('attack')||a.state==='airAttack'||a.state==='ult'||a.state==='ult2'){ctx.beginPath();ctx.moveTo(20,-55);ctx.lineTo(a.state==='ult2'?105:75,-80);ctx.stroke()}if(a.block||a.state==='parry'){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-60,58,-1.4,1.4);ctx.stroke()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070b20');g.addColorStop(.65,'#172048');g.addColorStop(1,'#080a13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of bgStars){ctx.globalAlpha=s.a;ctx.fillStyle='#d8e7ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#0a0d16';ctx.fillRect(0,ground(),W,H-ground());ctx.strokeStyle='#36466d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground());ctx.lineTo(W,ground());ctx.stroke();ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawF(P[0],0);drawF(P[1],1);ctx.restore();for(const q of particles){q.x+=q.vx/60;q.y+=q.vy/60;q.vy+=8;q.l-=.025;ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,2+q.l*4,0,7);ctx.fill()}particles=particles.filter(q=>q.l>0);ctx.globalAlpha=1;for(const q of texts){q.y-=.7;q.l-=.02;ctx.globalAlpha=q.l;ctx.font='900 18px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(q.s,q.x,q.y)}ctx.globalAlpha=1;document.getElementById('hp0').style.width=(P[0].hp/P[0].c.hp*100)+'%';document.getElementById('hp1').style.width=(P[1].hp/P[1].c.hp*100)+'%';document.getElementById('en0').style.width=P[0].en+'%';document.getElementById('en1').style.width=P[1].en+'%';document.getElementById('timer').textContent=Math.ceil(t);shake*=.88}
function loop(now){if(!run){draw();return}let dt=Math.min(.035,(now-last)/1000);last=now;t-=dt;if(t<=0){t=0;run=false;document.getElementById('msg').textContent=P[0].hp>=P[1].hp?'PHÚ THẮNG THEO THỜI GIAN':'SƯƠNG THẮNG THEO THỜI GIAN';document.getElementById('menu').classList.remove('hidden')}updateInput(0);ai();updateInput(1);physics(P[0],dt);physics(P[1],dt);for(const k in press)delete press[k];draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(!keys[e.code])press[e.code]=true;keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;press[k]=true},{passive:false});b.addEventListener('pointerup',e=>{e.preventDefault();keys[k]=false},{passive:false});b.addEventListener('pointercancel',()=>keys[k]=false)});document.getElementById('start').onclick=reset;draw();
</script></body></html>
